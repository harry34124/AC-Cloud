<script type="module">
  // One disposable native action context. Its sole clock is driven by the desktop host.
  window.actionReady = (async () => {
    window.actionInitPhase = "config";
    const data = await (await fetch("./daily.json")).json(),
      id = new URLSearchParams(location.search).get("action");
    const item = data.actions.find((x) => x.id === id);
    if (!item) throw Error("未知动作 " + id);
    if (data.nativeGuardURL) {
      const guard = await import(data.nativeGuardURL);
      guard.installNativeMemoryGuard(Live2DCubismCore).installPixi(PIXI);
    }
    const query = new URLSearchParams(location.search),
      config = structuredClone(item.config),
      layoutX = query.has("layoutX") ? Number(query.get("layoutX")) : NaN;
    if (query.get("demo") === "1") {
      config.dialoguePreview = true;
      config.dialogueVariant = 0;
    }
    if (query.has("followupPreview"))
      config.followupPreview = query.get("followupPreview") === "1";
    const base = new URL(item.url, location.href),
      module = await import(new URL(config.adapterModule, base));
    window.desktopWords = true;
    const apps = [],
      models = [],
      Application = PIXI.Application,
      from = PIXI.live2d.Live2DModel.from;
    window.actionLoadStats = () => ({
      renderers: apps.length,
      models: models.length,
    });
    PIXI.Application = class extends Application {
      constructor(...args) {
        super(...args);
        apps.push(this);
      }
    };
    PIXI.live2d.Live2DModel.from = async function (...args) {
      const model = await from.apply(this, args);
      models.push(model);
      return model;
    };
    window.actionInitPhase = "native factory";
    let adapter;
    try {
      adapter = await module.createAdapter(
        config,
        base,
        document.getElementById("stage"),
      );
    } finally {
      PIXI.Application = Application;
      PIXI.live2d.Live2DModel.from = from;
    }
    const { wrapDesktopSequence } =
      await import("/desktop/generated/desktop-sequence.mjs");
    adapter = wrapDesktopSequence(adapter);
    // Upload both front/side textures and compile shaders while still hidden.
    // Composite sword adapters manage Cubism's shared shader instance across their
    // own GL contexts. Their native render path must own shader preparation.
    window.actionInitPhase = "warmup";
    if (!["A58", "A59"].includes(item.id))
      for (const app of apps) {
        const rt = PIXI.RenderTexture.create({ width: 1, height: 1 });
        for (const model of models) {
          let parent = model;
          while (parent && parent !== app.stage) parent = parent.parent;
          if (!parent) continue;
          const visible = model.visible;
          model.visible = true;
          for (const texture of model.textures)
            app.renderer.texture.bind(texture.baseTexture);
          app.renderer.render(model, { renderTexture: rt });
          model.visible = visible;
        }
        rt.destroy(true);
      }
    window.actionInitPhase = "first frame";
    adapter.render(0);
    adapter.desktopGL =
      apps.find((app) => app.view === adapter.canvas)?.renderer.gl ?? null;
    window.actionWarmup = { models: models.length, renderers: apps.length };
    window.actionAdapter = adapter;
    window.actionInitPhase = "ready";
    return adapter;
  })();
</script>
